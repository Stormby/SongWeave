<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Songweave • MIDI composer</title><style>
:root{color-scheme:dark;--page:#161916;--panel:#20251f;--line:#42493e;--txt:#f4f1e4;--dim:#b4baaa;--lime:#d9ef96;--mel:#e8c88f;--ch:#b6ca9e;--bass:#9ab9d2;--arp:#cfb1cc}
*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--txt);font:14px/1.45 'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
main{max-width:1100px;margin:auto;padding:24px 28px}header,.line,.transport,.actions,.brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap}header,.line{justify-content:space-between}
header{padding-bottom:17px;border-bottom:1px solid var(--line)}h1,h2,p{margin:0}h1{font-family:Georgia,serif;font-size:35px;font-weight:500;letter-spacing:-1.6px}h2{font-size:17px;letter-spacing:-.3px}.brand{gap:13px}.brand svg{width:36px;height:36px;color:var(--lime)}
#summary,.muted,label,.tag,small{color:var(--dim)}.tag,.bars,small{font-size:12px}button,select,input{font:inherit;color:var(--txt);background:var(--panel);border:1px solid var(--line);border-radius:6px}
button{cursor:pointer;padding:7px 11px}button:hover,select:hover{border-color:var(--dim)}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
button:disabled,input:disabled{opacity:.45;cursor:default}button[aria-pressed=true],.current{background:#3e4b33;color:var(--lime);border-color:#9eaf7b}.primary{background:var(--lime);color:#19220e;font-weight:650;border-color:var(--lime)}.primary:hover{background:#e3f6ab}
.controls{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr 1fr 1.2fr 1.35fr;gap:10px;padding:18px 0}label{display:flex;flex-direction:column;gap:5px;font-size:12px}select,input[type=number]{padding:7px 8px;width:100%;font-size:14px;min-width:0}
.transport{padding:10px 0 15px}.transport .check{flex-direction:row;align-items:center}.transport .spacer{flex:1}.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:14px}.panel .line{margin-bottom:10px}
.timeline{display:flex;gap:4px;overflow-x:auto}.timeline button{min-width:63px!important}details{margin-top:10px}summary{color:var(--dim);cursor:pointer;font-size:12px}.edits{display:flex;align-items:end;flex-wrap:wrap;gap:7px;margin-top:8px}.edits input{padding:6px 8px}.edits input[type=number]{width:75px}.edits button{font-size:12px}.edits input[type=text]{width:140px}.timeline button{border-radius:5px;text-align:left;min-width:0;padding:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:#313a2d;border-color:#536748;font-size:12px}
.timeline button.current{background:#c9de92;color:#1d2913}.timeline small{display:block;font:11px ui-monospace,monospace;color:inherit;opacity:.9}.timeline progress{width:100%}#progress{width:100%;height:4px;display:block;margin-top:7px;accent-color:var(--lime)}
.rows{margin:6px 0 14px}.row{display:grid;grid-template-columns:minmax(65px,1fr) minmax(120px,4fr) repeat(4,auto);gap:8px;align-items:center;border-top:1px solid var(--line);padding:6px 0}.row:last-child{border-bottom:1px solid var(--line)}.row b{font-size:14px}.row button{font-size:12px;padding:5px 9px}.row canvas{width:100%;height:35px;background:#171c17;border-radius:4px}.actions{justify-content:space-between}.actions>div{display:flex;gap:7px;align-items:center}.status{margin-top:10px;min-height:1.45em;color:var(--dim);font-size:12px}
@media(max-width:700px){main{padding:15px}.controls{grid-template-columns:repeat(4,minmax(0,1fr))}.timeline{overflow-x:auto}.timeline button{min-width:65px}.row{grid-template-columns:60px minmax(30px,1fr) repeat(4,auto);gap:4px}.row button{padding:5px}.panel{padding:12px}.transport .spacer{display:none}}
</style></head><body><main>
<header><div class="brand"><svg aria-hidden="true" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 29Q12 29 16 15T37 10M3 22Q12 22 17 12T37 5M3 35Q14 35 21 21T37 16"/></svg><h1>Songweave</h1></div><span id="summary"></span></header>
<div class="controls"><label>Genre<select id="genre"></select></label><label>Key<select id="key"></select></label><label>Scale<select id="mode"></select></label><label>Meter<select id="meter"></select></label><label>Bars<select id="bars"></select></label><label>Form<select id="form"></select></label><label>Tempo · BPM<input id="bpm" type="number" min="20" max="400" step=".1"></label></div>
<div class="transport"><button class="primary" id="play">▶ Preview</button><label class="check" id="syncWrap" hidden><input type="checkbox" id="sync" checked>Live tempo</label><span class="spacer"></span><button id="back">Back</button><button id="variation">Variation</button><button id="new">New song</button></div>
<section class="panel"><div class="line"><h2>Arrangement</h2><button id="whole" class="current">Whole song</button></div><div class="timeline" id="sections" aria-label="Select a section to preview, vary or export"></div><progress id="progress" max="1" value="0" aria-label="Song playback position"></progress>
<details id="editPanel" hidden><summary>Edit selected section</summary><div class="edits">
<label>Section name<input id="sectionName" type="text" maxlength="40"></label><label>Bars<input id="sectionBars" type="number" min="1" max="64"></label>
<button id="left">Move earlier</button><button id="right">Move later</button><button id="repeat">Duplicate</button><button id="remove">Remove</button>
</div></details></section>
<div class="line"><h2 id="scope">Whole song</h2><span class="tag" id="selection"></span></div><div class="rows" id="rows"></div>
<div class="actions"><div><button class="primary" id="export">Export song MIDI</button></div><div><button id="save">Save project</button><button id="open">Open project</button><input type="file" id="file" accept=".json,.songweave" hidden></div></div>
<p class="status" id="status" role="status"></p></main>
<script>/*ENGINE*/</script><script>/*APP*/</script></body></html>
